<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支援記録 - nest-support</title>
<link rel="stylesheet" href="/static/shared.css">
</head>
<body>
<script>
// 認証切れ(401)を共通ログインへ誘導する（全 fetch を横断ハンドリング）。
(function () {
  const _fetch = window.fetch;
  window.fetch = function () {
    return _fetch.apply(this, arguments).then(function (res) {
      if (res.status === 401) {
        location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
        throw new Error('unauthenticated');
      }
      return res;
    });
  };
})();
</script>
<div class="container">
    <a href="/" class="nav-back">&larr; メニューに戻る</a>
    <h1 style="font-size:20px; margin: 8px 0 16px;">支援記録を入力</h1>
    <p class="hint" style="margin-bottom:12px;">本人は仮名（C-……）で選びます。記録者はログインしたあなたです（名前の入力は要りません）。</p>

    <form id="record-form">
        <!-- 本人と日付 -->
        <div class="card">
            <div class="form-group">
                <label>本人（仮名）</label>
                <select id="clientId" required>
                    <option value="">選択してください</option>
                </select>
            </div>
            <div class="form-group">
                <label>日付</label>
                <input type="date" id="logDate" required>
            </div>
        </div>

        <!-- 場面と対応 -->
        <div class="card">
            <div class="form-group">
                <label>場面</label>
                <div class="hint">どんな場面でしたか？</div>
                <div class="chip-group" id="situationChips">
                    <span class="chip" data-value="食事">食事</span>
                    <span class="chip" data-value="作業">作業</span>
                    <span class="chip" data-value="入浴">入浴</span>
                    <span class="chip" data-value="散歩">散歩</span>
                    <span class="chip" data-value="他者交流">他者交流</span>
                    <span class="chip" data-value="就寝">就寝</span>
                    <span class="chip" data-value="移動">移動</span>
                    <span class="chip" data-value="その他">その他</span>
                </div>
                <input type="hidden" id="situation" required>
            </div>

            <div class="form-group">
                <label>対応（任意）</label>
                <div class="hint">何をしましたか？</div>
                <textarea id="action" placeholder="例: 静かな別室に移った"></textarea>
            </div>

            <div class="form-group">
                <label>対応の効果（任意）</label>
                <div class="chip-group" id="effectivenessChips">
                    <span class="chip" data-value="Effective">&#9989; 効果的</span>
                    <span class="chip" data-value="Neutral">&#10134; どちらでもない</span>
                    <span class="chip" data-value="Ineffective">&#10060; 効果なし</span>
                    <span class="chip" data-value="Unknown">&#10067; 分からない</span>
                </div>
                <input type="hidden" id="effectiveness">
            </div>
        </div>

        <!-- メモと次の対応 -->
        <div class="card">
            <div class="form-group">
                <label>メモ（任意）</label>
                <textarea id="note" placeholder="例: 隣のフロアで工事が始まった"></textarea>
            </div>
            <div class="form-group">
                <label>次の対応（任意）</label>
                <textarea id="nextAction" placeholder="例: 工事の日程を家族に伝える"></textarea>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">
            記録を登録する
        </button>
        <div class="spinner" id="spinner"></div>
    </form>
</div>

<div class="toast toast-success" id="toast-ok">登録しました</div>
<div class="toast toast-error" id="toast-err">登録できませんでした</div>

<script>
// 今日の日付をデフォルトに
document.getElementById('logDate').value = new Date().toISOString().split('T')[0];

// 本人の一覧（ID と仮名だけ。名前は来ない）
fetch('/api/clients')
    .then(r => r.ok ? r.json() : [])
    .then(clients => {
        const sel = document.getElementById('clientId');
        clients.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.clientId;
            opt.textContent = c.displayCode;
            sel.appendChild(opt);
        });
    });

// チップ選択ロジック
document.querySelectorAll('.chip-group').forEach(group => {
    group.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
            group.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
            chip.classList.toggle('selected');
            const hidden = document.getElementById(group.id.replace('Chips', ''));
            if (hidden) hidden.value = chip.dataset.value;
        });
    });
});

// フォーム送信（ゲートを通して登録する。止められたら理由を出す）
document.getElementById('record-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    btn.disabled = true;
    spinner.style.display = 'block';

    const body = {
        clientId: document.getElementById('clientId').value,
        date: document.getElementById('logDate').value,
        situation: document.getElementById('situation').value,
        action: document.getElementById('action').value,
        effectiveness: document.getElementById('effectiveness').value,
        note: document.getElementById('note').value,
        nextAction: document.getElementById('nextAction').value,
    };

    try {
        const res = await fetch('/api/support-log', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            const detail = Array.isArray(err.detail) ? err.detail.map(d => d.msg || d).join(' / ') : (err.detail || '');
            document.getElementById('toast-err').textContent = '登録できませんでした' + (detail ? '：' + detail : '');
            throw new Error('Server error');
        }

        showToast('toast-ok');
        // フォームリセット（本人と日付は残す）
        ['action', 'note', 'nextAction', 'situation', 'effectiveness'].forEach(id => document.getElementById(id).value = '');
        document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
    } catch (err) {
        showToast('toast-err');
    } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
    }
});

function showToast(id) {
    const el = document.getElementById(id);
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
}
</script>
</body>
</html>
