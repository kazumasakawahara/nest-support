# nest-support の新しい Neo4j（ADR-001 D2-2・計画 N-18）。Community 版を 2 つ：個人の側と資源の側。
#
# 前の DB（nest-support-neo4j、7688、neo4j_data/ など）は起動しない。この compose には入れていない。
# 前のコンテナと同じ compose のプロジェクトにならないよう、name を分けた（down で前のコンテナに触れないため）。
# docker compose down に --remove-orphans を付けない。
#
# 使い方（Mac。起動は河原さんが compose の中身を確かめてから。台帳 G-48）:
#   認証情報は ~/.config/nest/neo4j-redesign.env に置く（リポジトリには置かない。権限 600）:
#     NEST_PERSONAL_PASSWORD=...
#     NEST_RESOURCE_PASSWORD=...
#   起動の前に docker ps で、前の DB のコンテナが動いていないことを確かめる
#   docker compose --env-file ~/.config/nest/neo4j-redesign.env up -d
#   docker compose --env-file ~/.config/nest/neo4j-redesign.env down   # 試験の終わりに必ず止める
#
# DB を使う試験の専用の DB（neo4j-test。2026-11-12 河原さん。案 A。台帳 G-103）。profile "test" なので、上の up -d・down では動かない:
#   docker compose --env-file ~/.config/nest/neo4j-redesign.env up -d neo4j-test    # 起動（127.0.0.1:36474・36687）
#   docker compose --env-file ~/.config/nest/neo4j-redesign.env stop neo4j-test     # 停止
#   パスワードは個人の側と同じ NEST_PERSONAL_PASSWORD（新しい設定を足さない）。中身は架空の試験の残りだけで、試験の始まりに毎回空にする
#   ポートは、この Mac で使われていない 36xxx（nest-support の 37xxx・38xxx、tsunagu-net の 17xxx・27xxx・47xxx・48xxx、
#   バックアップの試験の使い捨ての 39687 を避けた）
#
# 入れるデータは架空のフィクスチャだけ。実データの読み込みは、契約の確認の記録がそろうまでしない。
# APOC は入れない。プラグインのフォルダもマウントしない（計画 N-18。台帳 G-35 の 3）。
# 版は tsunagu-net と同じ 5.26.32（長期サポート版）を digest で固定。資源の側に tsunagu-net の書き出し（dump）を読み込むため、同じ版にそろえた。
# digest は tsunagu-net の compose.yaml（2026-10-26 に Mac で取得したもの）から写した。nest-support の側では取り直していない。

name: nest-redesign

services:
  neo4j-personal:
    image: neo4j:5.26.32-community@sha256:adaa077a3ab023015143b8f73f7076a7d053f12985f5b06f4c6a128c3a2f7240
    container_name: nest-redesign-personal
    ports:
      - "127.0.0.1:37474:7474"
      - "127.0.0.1:37687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEST_PERSONAL_PASSWORD:?set in ~/.config/nest/neo4j-redesign.env}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      # file: の LOAD CSV を止める（tsunagu-net と同じ。http(s) は Community 版に止める設定が無く、読み取りの包みで止める。N-22）
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
      # 匿名の利用の情報を Neo4j 社に送らない（既定は送る。docs/external-api.md に無い送信。台帳 G-75）
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - ./nest_neo4j_personal_data:/data
      - ./nest_neo4j_personal_logs:/logs
    stop_grace_period: 60s
    restart: "no"

  neo4j-resource:
    image: neo4j:5.26.32-community@sha256:adaa077a3ab023015143b8f73f7076a7d053f12985f5b06f4c6a128c3a2f7240
    container_name: nest-redesign-resource
    ports:
      - "127.0.0.1:38474:7474"
      - "127.0.0.1:38687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEST_RESOURCE_PASSWORD:?set in ~/.config/nest/neo4j-redesign.env}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
      # 匿名の利用の情報を Neo4j 社に送らない（既定は送る。docs/external-api.md に無い送信。台帳 G-75）
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - ./nest_neo4j_resource_data:/data
      - ./nest_neo4j_resource_logs:/logs
    stop_grace_period: 60s
    restart: "no"

  neo4j-test:
    image: neo4j:5.26.32-community@sha256:adaa077a3ab023015143b8f73f7076a7d053f12985f5b06f4c6a128c3a2f7240
    container_name: nest-redesign-test
    profiles: ["test"]
    ports:
      - "127.0.0.1:36474:7474"
      - "127.0.0.1:36687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEST_PERSONAL_PASSWORD:?set in ~/.config/nest/neo4j-redesign.env}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "false"
      # 匿名の利用の情報を Neo4j 社に送らない（既定は送る。docs/external-api.md に無い送信。台帳 G-75）
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - ./nest_neo4j_test_data:/data
      - ./nest_neo4j_test_logs:/logs
    stop_grace_period: 60s
    restart: "no"
