services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Neo4j データベース
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  neo4j:
    image: neo4j:5.15-community
    container_name: nest-support-neo4j
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt/Neo4j Protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
      - ./neo4j_plugins:/plugins
      - ./neo4j_backup:/backup
    restart: unless-stopped

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Neo4j データベース（生活困窮者自立支援）
  # ⚠️ 非運用（2026-05 廃止）: 生活困窮支援機能は使用しないため無効化。
  #   誤起動防止のためサービス定義をコメントアウトしている。
  #   再開する場合は以下のコメントを解除し、Skill を decommissioned/ から
  #   claude-skills/ へ戻したうえで .mcp.json に livelihood-support-db を再追加する。
  #   （詳細は decommissioned/README.md を参照）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
