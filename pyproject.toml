[project]
name = "nest-support"
version = "1.0.0"
description = "Claude-Native 親なき後支援データベース - Skills + Neo4j MCP"
readme = "docs/QUICK_START.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.0.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.2.1",
    "httpx>=0.27.0",
    "pydantic>=2.12.5",
    "google-genai==1.66.0",
    "python-multipart>=0.0.22",
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
# テストは nest/・sos/・scripts/ を import するため、リポジトリルートを import パスに含める。
pythonpath = ["."]
testpaths = ["tests"]
